[workspace]

[package]
name = "nemo-relay-native-intercept-fixture"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
nemo-relay-plugin = { path = "../../../../plugin" }
serde_json = "1"
# For the concurrent continuation the execution intercept offers: the ABI lets a
# plugin call `next` more than once while it runs, and a fixture that only ever
# called it once would not exercise that.
tokio = { version = "1", features = ["macros", "rt"] }
