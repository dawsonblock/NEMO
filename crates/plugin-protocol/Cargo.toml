[package]
name = "nemo-relay-plugin-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Stable contract for executing native plugins outside the kernel process."

[lints]
workspace = true

[dependencies]
nemo-relay-types.workspace = true
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# The scope identity a mark names is a UUID, and it is the same UUID the runtime
# uses: carrying it as text here and parsing it there would put two spellings of
# one identity on the boundary.
uuid = { workspace = true, features = ["v7", "serde"] }

[dev-dependencies]
serde_json = "1"
