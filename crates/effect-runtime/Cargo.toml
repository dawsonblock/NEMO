[package]
name = "nemo-effect-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Production composition boundary for the experimental durable EffectStore."
publish = false

[lints]
workspace = true

[dependencies]
nemo-relay = { workspace = true, features = ["unstable-hardening"] }
nemo-relay-executor = { workspace = true, features = ["unstable-hardening"] }
nemo-relay-ledger = { workspace = true, features = ["unstable-postgres"] }

[dev-dependencies]
nemo-relay-authority = { workspace = true, features = ["unstable-hardening"] }
postgres = { version = "0.19.14", features = ["with-serde_json-1"] }
serde_json = "1"
