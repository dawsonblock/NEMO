[package]
name = "nemo-relay-ledger"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Disabled-by-default durable-ledger contracts for NeMo Relay."
publish = false

[lints]
workspace = true

[features]
default = []
unstable-hardening = [
    "dep:serde",
    "dep:serde_json",
    "dep:serde_json_canonicalizer",
    "dep:sha2",
]
unstable-hardening-testkit = ["unstable-hardening"]
unstable-postgres = [
    "unstable-hardening",
    "dep:native-tls",
    "dep:postgres",
    "dep:postgres-native-tls",
    "dep:r2d2",
    "dep:r2d2_postgres",
]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
serde_json_canonicalizer = { version = "0.3", optional = true }
sha2 = { version = "0.11", optional = true }
native-tls = { version = "0.2.18", features = ["alpn"], optional = true }
postgres = { version = "0.19.14", features = ["with-serde_json-1"], optional = true }
postgres-native-tls = { version = "0.5.3", optional = true }
r2d2 = { version = "0.8.10", optional = true }
r2d2_postgres = { version = "0.18.2", optional = true }

[dev-dependencies]
openssl = "0.10.81"
rcgen = "0.13.2"

[[bin]]
name = "nemo-postgres-crash-fixture"
path = "src/bin/postgres_crash_fixture.rs"
required-features = ["unstable-postgres", "unstable-hardening-testkit"]
