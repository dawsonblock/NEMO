[package]
name = "nemo-relay-ledger"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Disabled-by-default durable-ledger contracts for NeMo Relay."
publish = false

[lints]
workspace = true

[features]
default = []
unstable-hardening = [
    "dep:serde",
    "dep:serde_json",
    "dep:serde_json_canonicalizer",
    "dep:sha2",
]
unstable-hardening-testkit = ["unstable-hardening"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
serde_json_canonicalizer = { version = "0.3", optional = true }
sha2 = { version = "0.11", optional = true }
