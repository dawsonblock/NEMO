# and adopted from inside that executor, because a tokio listener belongs to the reactor that made
# it. That removes a structural re-entrancy dependency — a single-lane caller can no longer make a
# plugin's codec call fail — and the two LLM qualifications now run on a current-thread caller to
# keep it that way. No dependency moved and no `unsafe` did.
# Raised by one line for the same commit's other change: the load the host performs names its
# approval with `NativePluginLoadSpec::with_approved_identity` rather than filling a field, and
# the one-line break that costs is the whole of the growth. No dependency moved and no `unsafe`
