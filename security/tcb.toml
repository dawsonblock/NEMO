#
# Trusted computing base policy for the NEMO kernel.
#
# Two tiers, because they answer different questions.
#
#   [trusted]     Code that *enforces* a kernel invariant: canonical identity,
#                 capability and grant verification, execution routing,
#                 idempotency, effect state transitions, receipts, and lease
#                 fencing. A function earns a place here by enforcing one of
#                 the properties in security/INVARIANTS.md.
#
#   [in_process]  Additional code linked into the same process as the kernel.
#                 It enforces none of those invariants, but a memory-safety or
#                 logic bug in it can subvert them anyway, so it belongs to the
#                 effective attack surface and is measured on its own tier.
#
# Providers, transports, bindings, the CLI, DLP and isolation implementations,
# qualification tooling, tests, and docs stay outside both tiers. The kernel
# must not know what PostgreSQL, Gmail, GitHub, or a language binding is.
#
# The native loader, the plugin SDK and the ABI left the in-process tier when the
# kernel stopped depending on them, and they are measured under `[plugin_host]`
# instead: they are the attack surface the kernel is protected *from*, not code
# that shares its process.
#
# Measuring for a target rather than for a host.
#
# `cargo tree` answers for the machine it runs on unless a target is named, and the
# platform-specific part of a graph is real: Linux resolves `openssl-sys` where macOS
# resolves `security-framework`, and a build-dependency is resolved for the machine that
# does the building. Two maintainers recording the same lockfile therefore recorded
# different numbers, and the gate failed where it was enforced while passing where it
# was recorded. The budgets and digests below are resolved for every platform at once —
# the union, which contains whichever platform is asking — so the numbers are the same
# on every machine and nothing hides behind a target either. That is why several
# ceilings below moved in this revision without a dependency being added: the raise is
# the correction, and each entry says so where it moved. The closure checks above are
# the exception: they ask what the kernel's own process can reach rather than how large
# a resolved set is, so they are resolved one platform at a time — for every platform
# the plugin-hosting packages are built for rather than for the one CI runs on — and
# the platform that is recorded instead of enforced is named below with the reach that
# keeps it out of the list.

version = 1

# The kernel library's closure, which is the property rather than the progress.
#
#     kernel library closure ∩ {libloading, native ABI, native loader, plugin SDK} = ∅
#
# It holds, and it is checked as a property: any reach at all is a failure. The
# kernel is the crate whose invariants the milestone protects, and it no longer
# names the loader, the ABI, the SDK or `dlopen` — not directly and not
# transitively. This is the difference between an architectural claim ("plugins run
# elsewhere") and a structural one ("the kernel cannot load a library even if
# somebody writes the code to").
#
# `nemo-relay-plugin-protocol` and `nemo-relay-types` are deliberately absent from
# the forbidden list: protocol types are what the kernel needs in order to talk to a
# host, and reaching them is the design rather than a leak.
[kernel_library_closure]
# Every platform the property is resolved for, rather than the one CI happens to run
# on. A single target left the rest of them unasked, which is a gap in a check whose
# whole argument is that the kernel cannot reach a loader: an edge that resolves only
# for musl or only for macOS would have skipped it. The list is the platforms the
# plugin-hosting packages are built for, and the platform that is deliberately not on
# it is named below with the reach that keeps it off.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]
roots = ["nemo-relay"]
forbidden = ["libloading", "nemo-relay-native-loader", "nemo-relay-native-abi", "nemo-relay-plugin"]

# The composition surfaces, every one that makes the isolation claim.
#
# All four shipping bindings are roots, not only the CLI and the FFI. The manifest that
# reintroduces the loader would name its own crate, and a root set that stopped at the
# CLI would stay green while Python linked it — which is the regression this list
# exists to catch. `nemo-relay-python` and `nemo-relay-node` are the names their
# manifests use; the C API is reached through `nemo-relay-ffi`, and the library through
# `nemo-relay`.
#
# The recorded set is empty and the intersection is required to be, so a composition
# that reaches any of these fails rather than being grandfathered.
[kernel_closure]
# The same list as the library's, and one target at a time: the composition surfaces
# are what ship, so the platforms they are packaged for are the platforms the property
# has to hold on.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]
roots = [
    "nemo-relay",
    "nemo-relay-cli",
    "nemo-relay-ffi",
    "nemo-relay-python",
    "nemo-relay-node",
]
forbidden = [
    "libloading",
    "nemo-relay-native-loader",
    "nemo-relay-native-abi",
    "nemo-relay-plugin",
]
reachable_now = []

# The platform that is recorded rather than enforced.
#
# `libloading` is two different things, and which one it is depends on who reached it.
# It is this repository's native loader when the kernel or a shipping composition
# reaches it, and it is a platform binding's own dynamic loader when the runtime the
# binding wraps pulls one in. The Windows N-API machinery does the latter, which is
# exactly why the union of every platform cannot be the set this property is stated
# over: under `--target all`, `nemo-relay-node` reaches `libloading` on Windows and on
# no other target.
#
# Recording that platform here rather than leaving it out changes what the check
# says. The target is measured like the others: its own resolve has to reach the
# packages named and no others of ours, so a platform's own loader cannot become
# cover for this repository's. A record the tree no longer needs is refused, the same
# way a temporary ceiling is, because an exemption nobody re-earns is one that hides
# the next reach.
[[kernel_closure.platform_external]]
target = "x86_64-pc-windows-msvc"
packages = ["libloading"]
reason = "the Node binding's N-API machinery loads its own runtime library there; native-plugin isolation is not implemented on Windows, so no composition of this milestone's ships there, and the loader this repository builds is absent from that resolve like every other"

[trusted]
crates = [
    "nemo-relay",
    "nemo-relay-types",
    "nemo-relay-authority",
    "nemo-relay-executor",
    "nemo-relay-ledger",
]

# Crates that share the kernel's process but do not enforce an invariant.
# Worker binaries run in their own processes and are deliberately excluded.
[in_process]
crates = [
    "nemo-effect-runtime",
    "nemo-relay-adaptive",
    "nemo-relay-dlp",
    "nemo-relay-isolation",
    "nemo-relay-pii-redaction",
    # Core depends on the plugin contract, so it is in the kernel's process.
    # It stays out of the invariant-enforcing tier: it carries vocabulary, not
    # enforcement.
    "nemo-relay-plugin-protocol",
    # The compatibility backend runs inside whichever process links it, which
    # today is the kernel's. It is counted here because that is physically true
    # now, and separately in [plugin_host] because that is where it belongs once
    # the loader crosses a process boundary. Counting it only in the target tier
    # would let an architecture diagram stand in for an accounting fact.
    "nemo-relay-plugin-host",
    # The wire crate is linked into the kernel's process too: the supervisor
    # converts and sends on the kernel's side of the boundary. It is budgeted on
    # its own line because its transitive set is dominated by the protobuf and
    # gRPC toolchain, but the tier is what says where its code runs.
    "nemo-relay-plugin-proto",
    "nemo-relay-worker-proto",
]

# The process that hosts native plugins: the supervisor and the child's own end of
# the protocol, the loader the child runs, the SDK a hosted plugin is built
# against, and the ABI tables both sides speak. None of it is in the kernel's
# address space any more, and all of it is what the kernel's boundaries exist to
# contain, so it is measured as its own role rather than as kernel code.
#
# `nemo-relay-plugin-host` is also listed in [in_process] because that is where its
# code runs today: the CLI and the FFI link it to supervise a host process.
[plugin_host]
crates = [
    "nemo-relay-plugin-host",
    "nemo-relay-native-loader",
    "nemo-relay-plugin",
    "nemo-relay-native-abi",
]

# Packages that must never appear in a trusted crate's resolved tree.
#
# The kernel depends on interfaces, not implementations, so a database driver
# or a foreign-function binding appearing here means an implementation leaked
# across the boundary. Measured with `cargo tree --all-features`, these hold
# today: core reaches `nemo-relay-ledger` for its effect-store contract, but the
# ledger crate keeps the PostgreSQL driver behind a feature core never enables.
#
# Transport and HTTP packages (`reqwest`, `tonic`, `axum`, `hyper`,
# `object_store`, `libloading`) are still reachable and are held flat by the
# budgets below rather than listed here, because a gate that is red on arrival
# enforces nothing.
[forbidden]
nemo-relay = [
    "sqlx",
    "tokio-postgres",
    "postgres",
    "deadpool-postgres",
    "diesel",
    "napi",
    "pyo3",
]
nemo-relay-types = [
    "sqlx",
    "tokio-postgres",
    "postgres",
    "deadpool-postgres",
    "diesel",
    "napi",
    "pyo3",
]
nemo-relay-authority = ["sqlx", "tokio-postgres", "postgres", "napi", "pyo3"]
nemo-relay-executor = ["sqlx", "tokio-postgres", "postgres", "napi", "pyo3"]
nemo-relay-ledger = ["sqlx", "napi", "pyo3"]

# Budgets.
#
# The `max_*` numbers are ceilings: exceeding one fails the gate, so growth has
# to be an explicit, reviewable edit to this file. They are deliberately not
# two-sided, because every code change in a trusted crate moves the line count
# and a gate that demands a file edit for every commit gets switched off.
#
# The `*_dependency_digest` fields are the ratchet that does not depend on the
# counts. They pin the resolved dependency sets *including versions*, so
# removing a harmless package and adding a dangerous one cannot pass by keeping
# the count equal, and a version change cannot pass at all.
#
# Source lines and `unsafe` tokens count every file under the crate's `src`,
# including inline test modules, and count `unsafe` textually without trying to
# strip comments. Both are upper bounds and never undercount.

[limits.nemo-relay]
# Raised to the platform union, not by a dependency: see the measurement note at the
# top of this file. The one identity this adds is `windows-sys`, a direct dependency the
# Windows build names and the machine that recorded the entry did not.
max_direct_dependencies = 39
# The kernel's dependency set is smaller than it has ever been in this milestone:
# two direct dependencies (`libloading` and the plugin SDK) and the loader's whole
# transitive set left with the loader, and the closure no longer reaches the ABI.
# The digest moved with them, which is the same fact written as an identity.
#
# Raised to the platform union; see the measurement note at the top of this file.
max_transitive_packages = 324
# Raised for the exact-registration entry points the process boundary calls —
# `invoke_tool_execution_intercept_registration`,
# `invoke_llm_execution_intercept_registration`, and the name-retaining registry
# merge behind them, which are what let a hosted plugin's callback resume a chain
# position that lives in this process. No `unsafe` moved with it, and no
# dependency did either: the kernel gained API surface, not reach. The last of it
# is the loader recording the registrations an instance *has* rather than a log of
# every one it ever made: a second activation against one instance used to double
# its own description, which the conversion then refused.
#
# Raised for what serving the three event sanitize classes needed on this side. The
# doors report whether the registration answered (`EventSanitizeOutcome`), because a
# host running a plugin's callback has to be able to tell the kernel it broke — a
# sanitizer that cleared everything and one that never worked are otherwise the same
# event. `runtime_mark` publishes the runtime's own failure records without offering
# them to the event sanitizers, which is the rule that keeps a sanitizer that cannot
# answer from looping on the record of its own failure. A single-entry runner sits
# under both, so the chain's fail-closed clearing and the door's reporting are one
# implementation. No dependency moved and no `unsafe` did.
#
# Raised once more for the Layer 1 repair: the exact-registration doors now make the
# same process-ownership claim every other entry point makes, their selection of a name
# held twice is a documented rule with a home rather than the order a merged vector
# happened to be built in, and the environment names the owner check reads are visible
# to the crate's tests so a suite cannot test a second spelling of them. No dependency
# moved and no `unsafe` did.
# Raised for the exact-registration doors of the LLM sanitize pair and the single-entry
# runners under them: one entry per direction, sharing the name-selection rule with the
# event doors rather than restating it, and reporting a sanitizer that did not answer so
# a host running the registration for another process can account for the omission. No
# dependency moved and no `unsafe` did.
#
# Raised once more for the kernel's deadline test: the constant became a ceiling, and the
# test that pins inheritance, shortening and capping is four lines of budget arithmetic.
# Raised for the approved-artifact type: the loader now takes an `ApprovedPluginArtifact`
# rather than an optional identity in a struct with public fields, so the three ways to ask
# for a load name themselves and a load with nothing approved has to be written. It is a
# type and its documentation rather than new reach — the digests were already checked, and
# no dependency moved and no `unsafe` did — and it is here because the next milestone makes
# the bindings use this API rather than remember the convention.
# Raised for the composition surface: the plugin ownership lease, the owner-scoped clear, and
# the exact initializer are now public, with the documentation that says why a composition
# outside the kernel needs each one. Nothing moved: the kernel still owns the registry, the
# lease and the teardown, and this is the narrower of the two ways to let a composition drive
# them — the alternative is the composition reaching the in-process activation API, which is
# what the cutover removes. No dependency moved and no `unsafe` did.
#
# Raised by eight lines for the documentation on the composition surface: the kernel's lease,
# its owner-scoped clear and its exact initializer are public, and each says why a composition
# outside the kernel needs it rather than leaving the next reader to infer it. No dependency
# moved and no `unsafe` did.
#
# This is the last upward movement before the loader leaves: the next change to this number
# is the deletion of the loader and the ABI bridge, and it moves down.
#
# That claim has been spent twice now, and both times recorded rather than quietly ignored.
#
# Separating the artifact vocabulary from the loader put the identity of an artifact, the
# digests that name it and the path resolution its manifest needs in
# `plugin/dynamic/artifact.rs`: 34 lines the kernel carries while the loader does.
#
# The hosted-runtime seam is the second movement, and it is a different kind of line: a
# boundary rather than a postponed move. The loader's kernel reach was twenty-odd private
# names spread across five modules; rewriting it against `NativeHostRuntime` replaced those
# with one handle whose operations are the vocabulary, and the kernel is where that
# vocabulary belongs — it stays when the loader leaves, because the operations are the
# kernel's decisions about its own registry, invocations and artifacts. The raise is the
# handle, its documentation and the module doc that says what the four responsibilities
# are, and the number is written down once rather than estimated in prose here: it moved
# by one line between the measurement and the commit, which is what a paragraph quoting a
# figure cannot be trusted to stay ahead of. No dependency moved and no `unsafe` did: the
# three extra `unsafe` tokens an earlier draft of the seam's own test added were moved out
# of `src/` rather than budgeted, because a keyword list is not kernel code.
#
# The two postponed files are owed no longer, and the movement is what the milestone was
# for: the loader left the kernel, and this figure fell by more than seven thousand lines
# without a line being deleted. What is left is the kernel's own code plus the seam and the
# artifact vocabulary, which are the kernel's half of the boundary. The target below is
# still above this number by less than a hundred lines, which is the honest state: the
# composition surface grew slightly while the loader was leaving.
max_source_lines = 68004
# Raised for the three exact-registration entry points the event sanitize classes
# need: one public entry per class over a private shared helper, which is how a host
# is asked to run exactly the registration a proxy names rather than the family.
# Nineteen, which is the number the temporary ceiling promised, so that entry is gone: the
# kernel's `unsafe` is now what it contains rather than what it borrowed, and the loader's
# 288 tokens left with the loader.
max_unsafe_occurrences = 19
