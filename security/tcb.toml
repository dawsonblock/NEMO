# Raised for resolving the host, and for saying where it looked when it is not there: the paths
# beside the starting executable are built once and read twice — by the lookup that picks one and
# by the failure that reports all of them — so a deployment that received a runtime without the
# host is told which locations were expected rather than only that a spawn failed. The test that
# pins the message is in this crate. No dependency moved and no `unsafe` did.
# Raised for expecting a host build rather than accepting whichever one answers: the config
# carries what this runtime expects, the handshake refuses a disagreement before the frame limit
# and before any capability, and the values a kernel offers are gathered into one struct so a
# parameter list of seven strings cannot have two of them passed in the wrong order. No dependency
# moved and no `unsafe` did.
# Raised for the shared activation path: one module that claims the kernel's ownership, activates
# the configuration's own components, starts the process-hosted plugins, rolls the whole thing
# back if any stage fails, and refuses a worker plugin it cannot run rather than half-serving it.
# It exists so the CLI and the bindings stop being four compositions with four lifecycles — the
