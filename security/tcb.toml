# The in-process plugin backend. Measured from the start so its growth is
# visible, but it sits in neither tier: it is the compatibility bridge that the
# process backend replaces, and its own `unsafe` count is 1 only because
# counting is textual and this crate's documentation says the word once.
#
# It also builds the host process and the supervisor that starts it, which is
# why it now carries a gRPC stack: the transport client is on the kernel's side
# of the boundary and the transport server on the host's, and both live here
# until the host becomes its own package.
#
# Budget raise (native-plugin process boundary, hardening): the code that
# implements the boundary grew, which is the direction the milestone expects —
# this crate is the destination the loader moves to, not the kernel. The
# continuation machinery is now shared by the tool and provider families, so the
# second family cost a tagged position and an arm rather than a second mechanism.
# The duplex session's driver is the streaming family's first piece: the kernel's
# side of the channel a plugin pulls a wrapped stream over, and — its other half —
# the host's end of the same channel, where a callback's pull becomes a message and
# a dropped stream becomes a cancellation. The upstream half is here too: the host
# runs a streaming registration and answers with the frames its returned stream
# produces, and the kernel reads them one at a time through the proxy for that
# class. The streaming class is still not in the served set, so none of it runs in
# production yet. Four direct
# dependencies arrived with it: `getrandom` for the 256-bit session capability,
# `subtle` for the comparison that must not leak it, `rustix` for the resource
# ceilings applied between `fork` and `exec`, and `futures-util` for catching a
# panic in a resumed chain rather than letting the request disappear. The second
# `unsafe` token is that `pre_exec`, which is unsafe by construction: it runs in
# the forked child, allocates nothing, and takes no locks. The transitive set is
# unchanged, so nothing new was pulled in behind them. Both counts leave the
# kernel-process figure when the loader does.
#
# Budget raise (cancellation cascade): the cascade is one property with three
# ownership states, and the tests that pin it cost more than the fix. The host's
# session-channel reader now cancels a stream the kernel opened for a call that
# is no longer waiting — the one window where the identity of what to cancel
# exists nowhere else — which is thirty lines and one awaited send. The rest is
# the evidence: the streaming-cascade test drives a real plugin over a real
# socket in each of those states (a producer that reports its own creation and
# drop, and a gate that holds the kernel inside an open so the consumer can leave
# while it is in flight) and the session channel names the same window directly.
# No dependency moved and no `unsafe` did.
#
# Budget raise (per-stream actors): the kernel's session stopped answering pulls
# itself and started routing them to an actor per stream, so that no producer can
# decide whether the session serves anything else. It is a rewrite of the file
# this budget already paid for plus the actors that replace its loop, and the
# evidence is the larger half: the interruptibility tests (a producer parked in
# `poll_next` while another stream is served and the parked one is cancelled, at
# the dispatcher and again over a real socket), the one-outstanding-pull refusal,
# cross-stream isolation, a panicking producer that fails only its own stream,
# the two ceilings, and the shutdown drain that ends the answer stream only once
# every producer is gone. Both the dispatcher and the actors also carry the
# written form of the invariants they rest on, which is where most of the growth
# is. No dependency moved, no `unsafe` did, and the streaming class is still not
# served. The last of it is the cancellation this work made reachable: a consumer
# that read a stream to its end and let it go sends the same message as one that
# cancelled a live stream, and a kernel that refused the first would end the
# session over a race the boundary creates. Cancellation is idempotent where the
# stream is already settled, and the host releases a stream it is done with so the
# kernel can forget it — three tests, and the prose that says which cancellation
# is still refused.
#
# Budget raise (credit and the three ceilings): a stream's demand and its cost are
# now counted rather than implied. Credit is granted by a pull and spent by a data
# frame, so a stream nobody has asked about is not polled at all; the frame, byte
# and frame-count ceilings are checked before every frame crosses, the frame that
# opens a stream and the one that ends it included. The tests are more than half of
# the growth — each ceiling runs limit−1, the limit and limit+1, and the laziness
# test counts the polls a producer is asked for — and the rest is the measurement
# and the prose that says which reading of "initial credit" this is. No dependency
# moved and no `unsafe` did.
#
# Budget raise (deadlines and transport disappearance): the deadline is three more
# waits in the actor — the open, the demand, and a pull whose producer is still
# working — plus the state that holds a stream's ending for the pull that has not
# been made yet, and half the growth is the four states' tests. The other half is
# the host's end of the session learning what it had been assuming: a session that
# ends fails the streams it was serving rather than closing them, with the calls
# still waiting woken and the calls that follow refused, and two tests that require
# the producer of a producing stream and of a stream nobody asked about to be gone
# when their session is. The last of it is the mirror of that rule on the kernel's
# side of the frames: a host that answered and stopped used to be read as a host
# that finished, which is what the terminal frame exists to distinguish, and the
# three shapes of a frames stream are now one test.
#
# Budget raise (mark matrix): the attribution matrix is a harness and three forced
# schedules — a kernel serving two operations from one session, a harness that gives
# both invocations the same schedule, and the schedules themselves — plus the
# fixture's four marking positions and the gate that makes their order the test's
# rather than the scheduler's. The last of it is the mark-context gates: the
# lifecycle tests (a callback that panics, a stream that panics while being polled,
# two continuations of one callback), the closed-window refusal that proves
# capability non-reuse, the guard that puts a window back when a poll unwinds, and
# the entry negotiation — extracted from the loader so the order every
# already-built plugin depends on has a test of its own rather than a comment. No
# dependency moved and no `unsafe` did. The coverage commit's growth is the served
# set's one entry and the two lines of comment that say what crossed and what did
# not.
#
# Budget raise (qualification): the streaming qualification work is mostly tests.
# The raise is the fixture's mark, the test that records what was missing before it
# was fixed, the four shapes of a frames stream (each also requiring the held chain
# position to be given back), and the repeated mixture of three streams ending three
# ways. No dependency moved and no `unsafe` did.
#
# Budget raise (qualification): the Layer 2 gate for the three event sanitize
# classes is tests and one test-facing helper as well. The raise is the sentinel
# helper (a value planted in every observable field, and the assertion that none of
# it reaches an answer) plus the host's half of the nine properties: exactly one
# registration runs, the class is the registration's own, and refusal, a throwing
# callback, a malformed projection, an answer above the operation's budget and a
# call naming another registration, session or runtime each fail closed. The
# negative cases carry a control that the class is served at all, so none of them
# can pass while the class is unserved. No dependency moved and no `unsafe` did:
# this is what the boundary refuses, not what it reaches.
#
# Budget raise (serving the class): the kernel-side proxy for the three event sanitize
# families, its three typed wrappers, the host's runner for the projection, and the
# process-boundary qualification — a real child's sanitizers changing only the copy
# this runtime publishes, and a failing one unable to publish what it was shown. The
# recursion the qualification found is fixed on the core side, not here. No dependency
# moved and no `unsafe` did.
[limits.nemo-relay-plugin-host]
max_direct_dependencies = 15
max_transitive_packages = 239
max_source_lines = 19520
max_unsafe_occurrences = 2
