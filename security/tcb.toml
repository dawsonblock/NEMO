# The native plugin ABI's own crate — the first staged step of the split, and the
# reason the SDK's line above could lose its vocabulary without any caller noticing.
#
# It is in the in-process tier because the SDK that links it is. What is measured
# here is the ABI as a name of its own rather than folded into the SDK, so the
# milestone that moves the ABI across the boundary shows up as this crate leaving
# the policy rather than as one number inside another.
#
# Reach is the budget that stays at zero, and it is the point: the crate holds the
# revision constants, the status codes, the opaque handles, the boundary structs and
# the versioned host tables, and none of that may need anything else. A dependency
# appearing here is a change to what the ABI *is* — the frozen table would stop being
# freezable — which is why the mapping from the runtime's scope categories to the
# ABI's discriminator lives in the SDK as a function rather than here as a `From`
# impl. Both digests are the SHA-256 of the empty string, which is what "no direct
# dependencies" and "no transitive packages" hash to. The `unsafe` budget is the
# declarations themselves: `unsafe extern "C" fn` signatures and the `Send`/`Sync`
# witnesses for the tables, counted textually as they are everywhere else.
