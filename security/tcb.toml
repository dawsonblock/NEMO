# Raised for the regression that came out of the codec bridge's hunt: the bridge's own drop
# order, which every call survived and which hung only on teardown.
#
# Raised again for the response direction of the same class: its proxy, its host arm, the
# response half of the bridge, and the real-child qualification that resolves the call's response
# codec through the kernel. With that the boundary serves sixteen of sixteen, which is why the
# install match has no refusal arm left. No dependency moved and no `unsafe` did.
# Raised for the kernel's callback executor: the supervisor starts a runtime of its own for the
