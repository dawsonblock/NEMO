# handle is a raw pointer by definition. The rest of the raise is the negotiation
# that keeps older plugins working now that the current table is a version they do
# not know: a frozen v4 table is offered before the v3 and v2 ones.
#
# Raised for the two helpers that measure an answer against its operation's
