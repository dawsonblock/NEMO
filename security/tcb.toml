# The loader, measured as the host-side crate it is.
#
# This is the number that left the kernel: 7227 lines, 288 textual `unsafe` tokens
# and eleven direct dependencies, none of which the kernel can reach any more. It is
# budgeted here so that the crate the milestone moved is still watched — a loader
# that grows without a review is exactly what this file exists to prevent — and so
# that the two figures a reader compares (`kernel-process unsafe tokens`, and this)
# are both recorded rather than one being inferred from the other.
#
# `libloading` is its own direct dependency here, which is the whole point: the
# crate that opens a library is the only one that names the crate that can.
#
# The loader names the *ABI* rather than the authoring SDK, which is the dependency
# the symbol proof caught: the SDK is what a plugin is built against, and a binary
# that only loads plugins has no business carrying 829 of its symbols. The swap
# moved one direct dependency and shrank the transitive set by one; what it really
# removed is what the release binary linked.
