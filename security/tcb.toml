#
# Trusted computing base policy for the NEMO kernel.
#
# Two tiers, because they answer different questions.
#
#   [trusted]     Code that *enforces* a kernel invariant: canonical identity,
#                 capability and grant verification, execution routing,
#                 idempotency, effect state transitions, receipts, and lease
#                 fencing. A function earns a place here by enforcing one of
#                 the properties in security/INVARIANTS.md.
#
#   [in_process]  Additional code linked into the same process as the kernel.
#                 It enforces none of those invariants, but a memory-safety or
#                 logic bug in it can subvert them anyway, so it belongs to the
#                 effective attack surface and is measured on its own tier.
#
# Providers, transports, bindings, the CLI, DLP and isolation implementations,
# qualification tooling, tests, and docs stay outside both tiers. The kernel
# must not know what PostgreSQL, Gmail, GitHub, or a language binding is.

version = 1

[trusted]
crates = [
    "nemo-relay",
    "nemo-relay-types",
    "nemo-relay-authority",
    "nemo-relay-executor",
    "nemo-relay-ledger",
]

# Crates that share the kernel's process but do not enforce an invariant.
# Worker binaries run in their own processes and are deliberately excluded.
[in_process]
crates = [
    "nemo-effect-runtime",
    "nemo-relay-adaptive",
    "nemo-relay-dlp",
    "nemo-relay-isolation",
    "nemo-relay-pii-redaction",
    "nemo-relay-plugin",
    "nemo-relay-worker-proto",
]

# Packages that must never appear in a trusted crate's resolved tree.
#
# The kernel depends on interfaces, not implementations, so a database driver
# or a foreign-function binding appearing here means an implementation leaked
# across the boundary. Measured with `cargo tree --all-features`, these hold
# today: core reaches `nemo-relay-ledger` for its effect-store contract, but the
# ledger crate keeps the PostgreSQL driver behind a feature core never enables.
#
# Transport and HTTP packages (`reqwest`, `tonic`, `axum`, `hyper`,
# `object_store`, `libloading`) are still reachable and are held flat by the
# budgets below rather than listed here, because a gate that is red on arrival
# enforces nothing.
[forbidden]
nemo-relay = [
    "sqlx",
    "tokio-postgres",
    "postgres",
    "deadpool-postgres",
    "diesel",
    "napi",
    "pyo3",
]
nemo-relay-types = [
    "sqlx",
    "tokio-postgres",
    "postgres",
    "deadpool-postgres",
    "diesel",
    "napi",
    "pyo3",
]
nemo-relay-authority = ["sqlx", "tokio-postgres", "postgres", "napi", "pyo3"]
nemo-relay-executor = ["sqlx", "tokio-postgres", "postgres", "napi", "pyo3"]
nemo-relay-ledger = ["sqlx", "napi", "pyo3"]

# Budgets.
#
# The `max_*` numbers are ceilings: exceeding one fails the gate, so growth has
# to be an explicit, reviewable edit to this file. They are deliberately not
# two-sided, because every code change in a trusted crate moves the line count
# and a gate that demands a file edit for every commit gets switched off.
#
# The `*_dependency_digest` fields are the ratchet that does not depend on the
# counts. They pin the resolved dependency *sets*, so removing a harmless
# package and adding a dangerous one cannot pass by keeping the count equal,
# and shrinking a set also fails until the digest is refreshed here.
#
# Source lines and `unsafe` tokens count every file under the crate's `src`,
# including inline test modules, and count `unsafe` textually without trying to
# strip comments. Both are upper bounds and never undercount.

[limits.nemo-relay]
max_direct_dependencies = 39
max_transitive_packages = 264
max_source_lines = 71190
max_unsafe_occurrences = 299
direct_dependency_digest = "67e12bc2c2eada037886632599a6ba0776437ccad20946f7391765e82fade065"
transitive_dependency_digest = "9c50d4c299f763c50094e75aec0ddd53ce06e4c7c8ead62f30e111b4cc7c1678"

