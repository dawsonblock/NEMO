name: Effect contract conformance

on:
  pull_request:
    branches:
      - main
    paths:
      - 'crates/authority/**'
      - 'crates/core/**'
      - 'crates/executor/**'
      - 'crates/ledger/**'
      - 'crates/effect-qualification/**'
      - 'crates/effect-runtime/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'justfile'
      - 'scripts/qualification/run.sh'
      - 'scripts/qualification/**'
      - 'qualification/README.md'
      - 'docs/e3-baseline.md'
      - 'docs/reference/hardening.mdx'
      - '.github/actions/load-ci-tool-versions/**'
      - '.github/workflows/effect-contract-conformance.yml'
  push:
    branches:
      - 'hardening/**'
      - 'feat/effect-contract-*'
      - 'feat/effect-store-*'
      - 'codex/production-effect-store-*'
    paths:
      - 'crates/authority/**'
      - 'crates/core/**'
      - 'crates/executor/**'
      - 'crates/ledger/**'
      - 'crates/effect-qualification/**'
      - 'crates/effect-runtime/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'justfile'
      - 'scripts/qualification/run.sh'
      - 'scripts/qualification/**'
      - 'qualification/README.md'
      - 'docs/e3-baseline.md'
      - 'docs/reference/hardening.mdx'
      - '.github/actions/load-ci-tool-versions/**'
      - '.github/workflows/effect-contract-conformance.yml'
  workflow_dispatch:

concurrency:
  group: effect-contract-conformance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: unstable-hardening contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:747d5ed1fdeeb124b880fbe3d7c6557d2c4064ae41d6b6297d417882effce4be
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load CI tool versions
        id: ci-config
        uses: ./.github/actions/load-ci-tool-versions

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          components: clippy,rustfmt
          toolchain: ${{ steps.ci-config.outputs.rust_version }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: nemo-relay-effect-contracts-${{ steps.ci-config.outputs.rust_version }}
          workspaces: . -> target
          cache-all-crates: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2.77.6
        with:
          tool: just@${{ steps.ci-config.outputs.just_version }}

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.ci-config.outputs.default_python_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8
        with:
          version: ${{ steps.ci-config.outputs.uv_version }}
          enable-cache: false

      # Provenance is the first gate: it decides whether any other result in this
      # run describes the source that is actually checked out.
      - name: Run mandatory provenance tests
        run: uv run --locked python -m pytest scripts/qualification -q

      - name: Lint contract crates
        run: |
          cargo clippy --locked -p nemo-relay-authority --all-targets --features unstable-hardening -- -D warnings
          cargo clippy --locked -p nemo-relay-executor --all-targets --features unstable-hardening -- -D warnings
          cargo clippy --locked -p nemo-relay-ledger --all-targets --features unstable-hardening-testkit,unstable-postgres -- -D warnings
          cargo clippy --locked -p nemo-relay --all-targets --features unstable-hardening -- -D warnings
          cargo clippy --locked -p nemo-effect-qualification --all-targets -- -D warnings
          cargo clippy --locked -p nemo-effect-runtime --all-targets -- -D warnings

      - name: Run hardening contract conformance
        run: just test-effect-contracts

      - name: Run PostgreSQL transport security tests
        run: just test-postgres-transport-security

      - name: Run PostgreSQL EffectStore conformance
        env:
          NEMO_RELAY_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: just test-postgres-effect-store

      - name: Run PostgreSQL process crash recovery
        env:
          NEMO_RELAY_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: just test-postgres-crash-recovery

      - name: Run PostgreSQL migration integrity
        env:
          NEMO_RELAY_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: just test-postgres-migration-integrity

      - name: Run database failure boundary tests
        env:
          NEMO_RELAY_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: just test-postgres-db-failure-boundaries

      # The positive production-composition case needs a transport that can
      # attest readiness, which the shared plaintext service cannot. PostgreSQL
      # refuses a key file with weaker permissions than the database user, and a
      # bind mount does not carry ownership into the container, so the trust
      # material is baked into a small image instead of mounted.
      - name: Start a TLS-enabled PostgreSQL for the production composition case
        run: |
          set -euo pipefail
          workdir="${RUNNER_TEMP}/nemo-tls"
          mkdir -p "$workdir"
          # A CA-signed leaf rather than a self-signed certificate. The test
          # client verifies the chain, and a certificate that is both leaf and
          # trust anchor is accepted by openssl but not by every verifier.
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$workdir/ca.key" -out "$workdir/ca.crt" \
            -days 2 -subj "/CN=NEMO test CA"
          openssl req -newkey rsa:2048 -nodes \
            -keyout "$workdir/server.key" -out "$workdir/server.csr" \
            -subj "/CN=localhost"
          # `serverAuth` is not optional here: a verifier that enforces purpose
          # rejects a server certificate that does not claim it.
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\nkeyUsage=digitalSignature,keyEncipherment\n' \
            > "$workdir/san.ext"
          openssl x509 -req -in "$workdir/server.csr" \
            -CA "$workdir/ca.crt" -CAkey "$workdir/ca.key" -CAcreateserial \
            -out "$workdir/server.crt" -days 2 -extfile "$workdir/san.ext"
          printf '%s\n' \
            'FROM postgres:17.6-alpine@sha256:747d5ed1fdeeb124b880fbe3d7c6557d2c4064ae41d6b6297d417882effce4be' \
            'USER root' \
            'COPY server.crt /etc/ssl/server.crt' \
            'COPY server.key /etc/ssl/server.key' \
            'RUN chown postgres:postgres /etc/ssl/server.crt /etc/ssl/server.key \' \
            '    && chmod 600 /etc/ssl/server.key' \
            > "$workdir/Dockerfile"
          docker build -t nemo-pg-tls "$workdir"
          docker run -d --name nemo-tls-pg \
            -e POSTGRES_PASSWORD=postgres -p 5433:5432 nemo-pg-tls \
            -c ssl=on \
            -c ssl_cert_file=/etc/ssl/server.crt \
            -c ssl_key_file=/etc/ssl/server.key
          for _ in $(seq 1 40); do
            if docker exec nemo-tls-pg pg_isready -U postgres >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "the TLS-enabled PostgreSQL server did not become ready" >&2
          docker logs nemo-tls-pg >&2
          exit 1

      - name: Run runtime composition tests
        env:
          # Points at the TLS-enabled server so the fixture's schema and role
          # setup and the verified-transport store share one database.
          NEMO_RELAY_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5433/postgres
          NEMO_RELAY_TEST_POSTGRES_TLS_CA: ${{ runner.temp }}/nemo-tls/ca.crt
        run: just test-runtime-composition

      - name: Run physical schema verification
        env:
          NEMO_RELAY_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: just test-postgres-schema-verification

      - name: Run kernel and provider process restart
        env:
          NEMO_RELAY_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: just test-postgres-kernel-restart
