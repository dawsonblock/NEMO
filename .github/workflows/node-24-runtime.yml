name: Node 24 runtime

on:
  push:
    branches:
      - main
      - 'hardening/**'
    paths:
      - '.github/actions/load-ci-tool-versions/**'
      - '.github/ci-tool-versions.env'
      - '.github/workflows/node-24-runtime.yml'
      - '.nvmrc'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/node/**'
      - 'crates/core/**'
      - 'crates/adaptive/**'
      - 'integrations/correct-once/**'
      - 'justfile'
      - 'package-lock.json'
      - 'package.json'
      - 'rust-toolchain.toml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/actions/load-ci-tool-versions/**'
      - '.github/ci-tool-versions.env'
      - '.github/workflows/node-24-runtime.yml'
      - '.nvmrc'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/node/**'
      - 'crates/core/**'
      - 'crates/adaptive/**'
      - 'integrations/correct-once/**'
      - 'justfile'
      - 'package-lock.json'
      - 'package.json'
      - 'rust-toolchain.toml'
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Node 24 binding gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load CI tool versions
        id: ci-config
        uses: ./.github/actions/load-ci-tool-versions

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: ${{ steps.ci-config.outputs.rust_version }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: nemo-relay-node-24-${{ steps.ci-config.outputs.rust_version }}
          workspaces: . -> target
          cache-all-crates: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install test tools
        uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8 # v2.77.6
        with:
          tool: cargo-nextest@${{ steps.ci-config.outputs.cargo_nextest_version }},just@${{ steps.ci-config.outputs.just_version }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.ci-config.outputs.node_version }}

      - name: Verify the pinned Node.js runtime
        env:
          EXPECTED_NODE_VERSION: ${{ steps.ci-config.outputs.node_version }}
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < .nvmrc)" = "$EXPECTED_NODE_VERSION"
          test "$(node --version)" = "v$EXPECTED_NODE_VERSION"

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Check Node.js formatting and production dependencies
        run: |
          set -euo pipefail
          npm run format:check --workspace=nemo-relay-node
          npm audit --omit=dev --workspace=nemo-relay-node
          npm run format:check --workspace=nemo-relay-correct-once
          npm audit --omit=dev --workspace=nemo-relay-correct-once

      - name: Run Node.js binding tests
        run: just test-node

      - name: Run Correct-Once contract tests
        run: npm test --workspace=nemo-relay-correct-once
